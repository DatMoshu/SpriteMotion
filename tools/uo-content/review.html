<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SpriteMotion item review</title>
<style>:root{color-scheme:dark;font:14px system-ui;background:#101820;color:#e6eef3}body{margin:16px}canvas{display:block;image-rendering:pixelated;background:repeating-conic-gradient(#24313a 0% 25%,#202b34 0% 50%) 0/32px 32px;margin:20px auto;max-width:100%;width:512px;height:auto}select,button,input{font:inherit;margin:5px;padding:6px}label{white-space:nowrap}#error{color:#ffac9d}</style>
<strong id="title">Loading…</strong><div><select id="action" aria-label="Action"></select><select id="direction" aria-label="Facing"><option value="0">SE</option><option value="1">S</option><option value="2">SW</option><option value="3">W</option><option value="4">NW</option><option value="5">N (mirror SW)</option><option value="6">NE (mirror S)</option><option value="7">E (mirror SE)</option></select><button id="play">Pause</button><label><input id="body" type="checkbox" checked>Original body</label><label><input id="item" type="checkbox" checked>New item</label></div><div><label>Frame <input id="frame" type="range" min="0" value="0" max="0"></label><span id="number"></span></div><canvas id="canvas" width="256" height="256"></canvas><div id="error"></div>
<script>const $=id=>document.getElementById(id);let manifest,seq,img,playing=true,frame=0,version=0;const ctx=$('canvas').getContext('2d');ctx.imageSmoothingEnabled=false;
async function load(){let request=++version,d=+$('direction').value;let stored=d>4?7-d:d;seq=manifest.sequences.find(s=>s.action===+$('action').value&&s.dir===stored);if(!seq){$('error').textContent='This sequence is missing.';return}let next=new Image();next.src=seq.file;await next.decode();if(request!==version)return;img=next;frame=0;$('frame').max=seq.count-1;draw()}
function draw(){if(!img||!seq)return;ctx.clearRect(0,0,256,256);ctx.save();if(+$('direction').value>4){ctx.translate(256,0);ctx.scale(-1,1)}if($('body').checked)ctx.drawImage(img,frame*256,0,256,256,0,0,256,256);if($('item').checked)ctx.drawImage(img,frame*256,256,256,256,0,0,256,256);ctx.restore();$('frame').value=frame;$('number').textContent=`${frame+1} / ${seq.count}`}
$('action').onchange=load;$('direction').onchange=load;$('body').onchange=draw;$('item').onchange=draw;$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'Pause':'Play'};$('frame').oninput=()=>{playing=false;$('play').textContent='Play';frame=+$('frame').value;draw()};
fetch('manifest.json').then(r=>r.json()).then(async data=>{manifest=data;$('title').textContent=data.name;let seen=new Set();for(let s of data.sequences){if(seen.has(s.action))continue;seen.add(s.action);let o=document.createElement('option');o.value=s.action;o.textContent=s.name;$('action').append(o)}await load();setInterval(()=>{if(playing&&seq&&img){frame=(frame+1)%seq.count;draw()}},1000/data.fps)}).catch(e=>$('error').textContent=e.message);
</script></html>
