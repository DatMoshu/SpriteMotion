[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spritemotion"
version = "0.1.0"
description = "Reconstruct editable 3D characters and animations from existing 2D sprites."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
imaging = ["numpy>=1.24", "Pillow>=10"]
# scipy 1.13 is the first release built for numpy 2; older ones crash on import with a current numpy.
test = ["pytest>=7", "jsonschema>=4", "numpy>=1.24", "Pillow>=10", "scipy>=1.13"]

[project.scripts]
spritemotion = "spritemotion.pipeline.cli:main"

# The shared layer lives in common/ but imports as `spritemotion`.
[tool.setuptools]
package-dir = { "spritemotion" = "common" }
packages = [
    "spritemotion",
    "spritemotion.schemas",
    "spritemotion.sprites",
    "spritemotion.poses",
    "spritemotion.estimation",
    "spritemotion.fitting",
    "spritemotion.rendering",
    "spritemotion.pipeline",
]

[tool.setuptools.package-data]
"spritemotion" = ["web/*.mjs"]
"spritemotion.schemas" = ["*.schema.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Test order stays fixed: pytest-randomly (if a venv has it) reshuffles shared fixtures and workspace files.
addopts = "-p no:randomly"
